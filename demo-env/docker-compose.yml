# Disposable local backend for recording the LogiQuote dashboard.
# Postgres + Neon HTTP proxy, so the dashboard's @neondatabase/serverless driver works unchanged.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: logiquote_demo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d logiquote_demo"]
      interval: 2s
      retries: 30
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://demo:demo@postgres:5432/logiquote_demo
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
